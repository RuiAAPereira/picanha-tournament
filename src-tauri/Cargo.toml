[package]
name = "picanha-tournament"
version = "0.1.0"
description = "Gestor local de torneios de pool português"
authors = ["Picanha Tournament"]
edition = "2021"

[lib]
name = "picanha_tournament_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }

[dev-dependencies]
tempfile = "3"
